name: build-debug

on:
  workflow_dispatch:
  pull_request:
    branches: dev-*
    paths:
    - '**.cs'
    - '**.csproj'
    - '**.sln'
    - '**.props'
    - '**.resx'
    - '**.config'
    - '.github/workflows/**'

jobs:
  build-debug:
    runs-on: windows-latest
    steps:
      - name: "Get Short SHA"
        run: echo "SHORT_SHA=$("${{ github.sha }}".SubString(0, 8))" >> $env:GITHUB_ENV
      
      - name: Checkout Code
        uses: actions/checkout@v4

      # dotnet CLI builds SDK projects; .vdproj is opened in Visual Studio for the MSI.
      - name: Build solution
        run: dotnet build WinNUT_V2/WinNUT_V2.sln -c Debug --verbosity minimal

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ format('WinNUT-Client-debugbuild-{0}', env.SHORT_SHA) }}
          if-no-files-found: error
          path: WinNUT_V2/WinNUT.Client/bin/Debug/net48