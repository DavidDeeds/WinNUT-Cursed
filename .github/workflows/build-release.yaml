# Build solution in Release mode and submit a GitHub release.

name: build-release

on:
  push:
    tags: "v*"

env:
  # The desired name of the no-install archive to be uploaded along side the installer.
  ARCHIVE_NAME: "_WinNUT-Client-NoInstall"

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - name: Setup Git
        run: |
          git config --global url."https://user:${{ secrets.GITHUB_TOKEN }}@github".insteadOf https://github
          git config --global user.name github-actions
          git config --global user.email github-actions@github.com
      
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Extract version from tag
        id: get-ver
        run: ./.github/workflows/get-ver.ps1 ${{ github.ref }}

      - name: Confirm Build mode
        id: build-mode
        shell: pwsh
        run: |
          if ('${{ steps.get-ver.outputs.ISPRERELEASE }}' -eq 'true') {
            echo "BUILD_MODE=PreRelease" >> $env:GITHUB_OUTPUT
          } else {
            echo "BUILD_MODE=Release" >> $env:GITHUB_OUTPUT
          }
      
      - name: Publish WinNUT.Client (ClickOnce / publish output)
        working-directory: WinNUT-Cursed
        run: >
          dotnet publish "WinNUT.Client\WinNUT.Client.csproj"
          -c "${{ steps.build-mode.outputs.BUILD_MODE }}"
          -p:Version="${{ steps.get-ver.outputs.VER }}"
          -p:ApplicationVersion="${{ steps.get-ver.outputs.VER }}.0"
          -p:PublishDir="publish\"
      
      - name: Checkout pages branch
        uses: actions/checkout@v4
        with:
          ref: "gh-pages"
          path: "gh-pages"
      
      # SDK-style `dotnet publish` currently emits a flat folder; full ClickOnce (.application + Application Files) may be absent.
      - name: Prep ClickOnce branch and deploy
        if: hashFiles('WinNUT-Cursed/WinNUT.Client/publish/WinNUT-Client.application') != ''
        working-directory: gh-pages
        run: |
          $outDir = "WinNUT-Cursed/WinNUT.Client/publish"
          Write-Output "Removing previous files..."
          if (Test-Path "Application Files") {
              Remove-Item -Path "Application Files" -Recurse
          }
          if (Test-Path "WinNUT-Client.application") {
              Remove-Item -Path "WinNUT-Client.application"
          }
          Write-Output "Copying new files..."
          Copy-Item -Path "../$outDir/Application Files","../$outDir/WinNUT-Client.application" -Destination . -Recurse
          # Stage and commit.
          Write-Output "Staging..."
          git add -A
          Write-Output "Committing..."
          git commit -m "Update to ${{ steps.get-ver.outputs.SEMVER }}"
          # Push.
          git push
      
      - name: Prepare no install archive
        run: |
          $arc = Compress-Archive -PassThru -Path "WinNUT-Cursed\WinNUT.Client\bin\${{ steps.build-mode.outputs.BUILD_MODE }}\net48" -DestinationPath "${{ env.ARCHIVE_NAME }}-${{ steps.get-ver.outputs.SEMVER }}.zip"
          $arc = $arc -replace '\\','/'
          echo "ARCHIVE_NAME=$arc" >> $env:GITHUB_ENV
      
      # Rename the CO bootstrapper file to appear after the MSI once it's uploaded.
      - name: HACK - Rename ClickOnce bootstrapper
        if: hashFiles('WinNUT-Cursed/WinNUT.Client/publish/WinNUT-Client.application') != ''
        run: Rename-Item -Path "./WinNUT-Cursed/WinNUT.Client/publish/WinNUT-Client.application" -NewName "_WinNUT-Client-ClickOnce-Installer.application"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          fail_on_unmatched_files: false
          generate_release_notes: true
          files: |
            WinNUT-Cursed/WinNUT.Client/publish/_WinNUT-Client-ClickOnce-Installer.application
            ${{ env.ARCHIVE_NAME }}
            
# Leave out other files until we no longer need the MSI be first in the assets list.
# LICENSE.txt
# README.md
# CHANGELOG.md
